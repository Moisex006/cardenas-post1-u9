spring.application.name=seguridad

# Conexión a MySQL (credenciales por variable de entorno; los valores por
# defecto son los del laboratorio)
spring.datasource.url=jdbc:mysql://localhost:3306/seguridad_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080

# JWT (Parte 2): la clave HMAC se lee de la variable de entorno JWT_SECRET.
# El valor por defecto existe solo para ejecutar el laboratorio sin
# configuración adicional; en producción JWT_SECRET es obligatorio.
jwt.secret=${JWT_SECRET:clave-de-desarrollo-solo-para-el-laboratorio-u9-cambiar}
jwt.expiracion-ms=3600000
