<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
  <h1>Iniciar Sesión</h1>
  <!-- Spring Security procesa el POST a /login automáticamente -->
  <form th:action="@{/login}" method="post">
    <p th:if="${param.error}" class="error">Correo o contraseña incorrectos.</p>
    <p th:if="${param.logout}" class="ok">Sesión cerrada correctamente.</p>
    <p th:if="${param.registrado}" class="ok">Registro exitoso. Inicie sesión.</p>
    <label for="username">Correo:</label>
    <input type="email" id="username" name="username" required />
    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" required />
    <!-- th:action agrega automáticamente el campo oculto con el token CSRF -->
    <button type="submit">Ingresar</button>
  </form>
  <p><a th:href="@{/registro}">¿No tiene cuenta? Registrarse</a></p>
</body>
</html>
